<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件對照維護系統 (NMC_CONSTANTS)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">事件對照常數維護 (NMC_CONSTANTS)</h1>
                <p class="text-sm text-gray-500 mt-1">管理慢壘全系統使用的代碼、守備位置與打擊結果對照表 (LOV)</p>
            </div>
            <div id="lockStatusBadge" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700">
                載入中...
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            
            <div class="md:col-span-1 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">LOV 字典分類</h2>
                <div class="space-y-2" id="categoryMenu">
                    <button onclick="switchCategory('DEF', this)" class="w-full text-left px-3 py-2.5 rounded font-medium text-sm transition bg-blue-600 text-white shadow-sm">
                        🛡️ 守備位置 (DEF)
                    </button>
                    <button onclick="switchCategory('HIT', this)" class="w-full text-left px-3 py-2.5 rounded font-medium text-sm transition text-gray-700 hover:bg-gray-200">
                        ⚾ 打擊結果 (HIT)
                    </button>
                    <button onclick="switchCategory('LINEUP', this)" class="w-full text-left px-3 py-2.5 rounded font-medium text-sm transition text-gray-700 hover:bg-gray-200">
                        📋 隊列棒次 (LINEUP)
                    </button>
                </div>
            </div>

            <div class="md:col-span-3">
                <form id="constantsForm" onsubmit="event.preventDefault();">
                    
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            當前分類：<span id="currentCategoryTitle" class="text-blue-700 font-bold ml-1">守備位置 (DEF)</span>
                        </h3>
                        <button type="button" id="btnCreateRow" onclick="addConstantRow()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded shadow text-sm font-medium transition">
                            ＋ 新增代碼列
                        </button>
                    </div>

                    <div class="overflow-x-auto border border-gray-200 rounded-lg shadow-sm mb-4">
                        <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                            <thead class="bg-gray-50 text-gray-700 font-medium">
                                <tr>
                                    <th class="p-3 w-32">簡碼 (Code)</th>
                                    <th class="p-3">中文說明 (Name)</th>
                                    <th class="p-3 w-24">排序權重</th>
                                    <th class="p-3 w-28">是否啟用</th>
                                    <th class="p-3">備註</th>
                                    <th class="p-3 w-20 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="constantsTableBody" class="divide-y divide-gray-200 bg-white">
                                </tbody>
                        </table>
                    </div>

                    <div class="flex justify-end gap-3 border-t pt-4">
                        <button type="button" onclick="loadConstantsData()" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded shadow text-sm transition">放棄重讀</button>
                        <button type="button" id="btnSaveConstants" onclick="saveConstantsData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded shadow text-sm transition">儲存當前分類</button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script>
        // 1. 初始化 Supabase (已帶入你的實際憑證)
        const SUPABASE_URL = 'https://xteglzzciggiwblwzlvh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZWdsemZjaWdnaXdibHd6bHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY1Nzg4MDAsImV4cCI6MjAyMjE1NDgwMH0.xxx'; // 這裡維持你原有的完整金鑰即可
        
        // 💡 修正關鍵：將連線實例變數名稱改為 sbClient，避免與全域物件名稱衝突
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentCategory = 'DEF'; // 預設分類
        let isLocked = 'N';          // IS_LOCKED 狀態控制字串 ('Y' or 'N')

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', () => {
            checkLockStatus();
            loadConstantsData();
        });

        // 2. 模擬/讀取鎖定狀態控制
        function checkLockStatus() {
            // 可視賽務需求連動主檔狀態，此處預設為不鎖定 ('N')
            isLocked = 'N'; 
            handleLockUi(isLocked);
        }

        function handleLockUi(status) {
            const badge = document.getElementById('lockStatusBadge');
            const btnSave = document.getElementById('btnSaveConstants');
            const btnCreate = document.getElementById('btnCreateRow');

            if (status === 'Y') {
                badge.innerText = '🔒 系統常數已鎖定';
                badge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-red-100 text-red-700';
                if(btnSave) btnSave.style.display = 'none';
                if(btnCreate) btnCreate.style.display = 'none';
                disableTableInputs();
            } else {
                badge.innerText = '🔓 開放字典維護中';
                badge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-green-100 text-green-700';
                if(btnSave) btnSave.style.display = 'block';
                if(btnCreate) btnCreate.style.display = 'block';
            }
        }

        // 3. 切換分類選單
        function switchCategory(category, element) {
            currentCategory = category;
            
            // 更新標題
            const titles = { 'DEF': '守備位置 (DEF)', 'HIT': '打擊結果 (HIT)', 'LINEUP': '隊列棒次 (LINEUP)' };
            document.getElementById('currentCategoryTitle').innerText = titles[category];

            // 切換左側按鈕高亮樣式
            const buttons = document.querySelectorAll('#categoryMenu button');
            buttons.forEach(btn => btn.className = 'w-full text-left px-3 py-2.5 rounded font-medium text-sm transition text-gray-700 hover:bg-gray-200');
            element.className = 'w-full text-left px-3 py-2.5 rounded font-medium text-sm transition bg-blue-600 text-white shadow-sm';

            // 重新讀取該分類資料
            loadConstantsData();
        }

        // 4. 從 Supabase 讀取特定分類的常數
        async function loadConstantsData() {
            try {
                // 使用修正後的 sbClient
                const { data: constants, error } = await sbClient
                    .from('NMC_CONSTANTS')
                    .select('*')
                    .eq('category', currentCategory)
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                const tbody = document.getElementById('constantsTableBody');
                tbody.innerHTML = ''; // 清空舊畫面

                if (constants && constants.length > 0) {
                    constants.forEach(item => addConstantRow(item));
                } else {
                    if (isLocked !== 'Y') addConstantRow(); // 空白列供輸入
                }

                if (isLocked === 'Y') disableTableInputs();

            } catch (err) {
                console.error('讀取常數失敗:', err.message);
                alert('讀取資料失敗，請確認 Supabase 欄位設定與 RLS 是否關閉。');
            }
        }

        // 5. 動態產生表格列
        function addConstantRow(data = {}) {
            const tbody = document.getElementById('constantsTableBody');
            const rowId = 'const_row_' + Date.now() + Math.random().toString(36).substr(2, 5);

            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.className = 'hover:bg-gray-50 transition';

            tr.innerHTML = `
                <td class="p-2">
                    <input type="hidden" class="const-id" value="${data.constant_id || ''}">
                    <input type="text" class="const-code w-full border rounded p-1 text-center font-mono font-bold uppercase" value="${data.code || ''}" placeholder="如: B1" ${data.constant_id ? 'readonly bg-gray-50 text-gray-500' : ''}>
                </td>
                <td class="p-2"><input type="text" class="const-name w-full border rounded p-1" value="${data.name_zh || ''}" placeholder="如: 第一棒"></td>
                <td class="p-2"><input type="number" class="const-sort w-full border rounded p-1 text-center" value="${data.sort_order ?? 10}" placeholder="10"></td>
                <td class="p-2">
                    <select class="const-active w-full border rounded p-1">
                        <option value="Y" ${data.is_active !== 'N' ? 'selected' : ''}>啟用</option>
                        <option value="N" ${data.is_active === 'N' ? 'selected' : ''}>停用</option>
                    </select>
                </td>
                <td class="p-2"><input type="text" class="const-memo w-full border rounded p-1" value="${data.memo || ''}"></td>
                <td class="p-2 text-center">
                    <button type="button" onclick="deleteConstantRow('${rowId}')" class="btn-delete text-red-600 hover:text-red-900 font-medium">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function deleteConstantRow(rowId) {
            if (isLocked === 'Y') return;
            const row = document.getElementById(rowId);
            if (row) row.remove();
        }

        // 唯讀控制：鎖定表格內所有的輸入元件
        function disableTableInputs() {
            const tbody = document.getElementById('constantsTableBody');
            const inputs = tbody.querySelectorAll('input, select, button');
            inputs.forEach(input => {
                input.disabled = true;
                if (input.tagName === 'INPUT' || input.tagName === 'SELECT') {
                    input.classList.add('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
                }
            });
            const deleteBtns = tbody.querySelectorAll('.btn-delete');
            deleteBtns.forEach(btn => btn.style.display = 'none');
        }

        // 6. 批次儲存回 Supabase (整批更新/新增)
        async function saveConstantsData() {
            if (isLocked === 'Y') {
                alert('系統目前處於鎖定狀態，無法更新事件常數！');
                return;
            }

            try {
                const rows = document.querySelectorAll('#constantsTableBody tr');
                const updateDataArray = [];
                const codesSeen = new Set();

                // 收集前端資料並做初步防呆
                for (let row of rows) {
                    const code = row.querySelector('.const-code').value.trim().toUpperCase();
                    const nameZh = row.querySelector('.const-name').value.trim();

                    if (!code || !nameZh) continue; // 忽略空白沒填完整的列

                    // 檢查前端輸入是否有重複的 Code
                    if (codesSeen.has(code)) {
                        alert(`輸入錯誤：簡碼 [${code}] 在此分類中重複填寫了！`);
                        return;
                    }
                    codesSeen.add(code);

                    updateDataArray.push({
                        category: currentCategory,
                        code: code,
                        name_zh: nameZh,
                        sort_order: parseInt(row.querySelector('.const-sort').value) || 0,
                        is_active: row.querySelector('.const-active').value,
                        memo: row.querySelector('.const-memo').value
                    });
                }

                // 清除該分類舊資料，並重新寫入前端目前調整好的完整常數清單
                const { error: deleteError } = await sbClient
                    .from('NMC_CONSTANTS')
                    .delete()
                    .eq('category', currentCategory);

                if (deleteError) throw deleteError;

                if (updateDataArray.length > 0) {
                    const { error: insertError } = await sbClient
                        .from('NMC_CONSTANTS')
                        .insert(updateDataArray);

                    if (insertError) throw insertError;
                }

                alert(`[${currentCategory}] 分類資料儲存成功！`);
                loadConstantsData(); // 重新整理畫面

            } catch (err) {
                console.error('儲存失敗:', err.message);
                alert('儲存至 Supabase 失敗：' + err.message);
            }
        }
    </script>
</body>
</html>
