<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球隊登錄系統 (Master/Detail)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <label class="text-sm font-bold text-blue-900 whitespace-nowrap">🔍 選擇維護球隊：</label>
                <select id="queryTeamSelect" class="bg-white border border-blue-300 rounded-md p-1.5 text-sm font-medium w-64 focus:ring-2 focus:ring-blue-500">
                    </select>
                <button type="button" onclick="executeQuery()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-1.5 rounded text-sm font-medium shadow transition">
                    載入球隊資料
                </button>
            </div>
            <div id="lockStatusBadge" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-200 text-gray-700">
                載入中...
            </div>
        </div>

        <form id="teamForm" onsubmit="event.preventDefault();">
            
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-blue-700 flex items-center">
                        <span class="w-2 h-5 bg-blue-700 inline-block mr-2 rounded"></span> 球隊基本資料 (Master)
                    </h2>
                    <button type="button" id="btnSaveMaster" onclick="saveMasterData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-1.5 rounded shadow text-sm font-medium transition">
                        💾 儲存球隊主檔
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Team_id (流水號)</label>
                        <input type="text" id="team_id" readonly class="mt-1 block w-full bg-gray-100 border border-gray-300 rounded-md p-2 text-gray-500 font-mono" placeholder="系統自動生成">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">隊名</label>
                        <input type="text" id="team_name" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">學校</label>
                        <input type="text" id="school" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">科系</label>
                        <input type="text" id="department" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">成立年</label>
                        <input type="number" id="established_year" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">主球場</label>
                        <input type="text" id="main_field" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">副球場</label>
                        <input type="text" id="sub_field" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700">備註</label>
                        <input type="text" id="team_memo" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                </div>
            </div>

            <div class="mb-6 border-t pt-6">
                
                <div id="detailWorkflowAlert" class="mb-4 p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-sm flex items-center shadow-sm">
                    💡 <strong>系統提示：</strong> 請先填寫上方球隊基本資料並點擊「儲存球隊主檔」，建立正式編號後，系統才開放下方球員名單登記。
                </div>

                <div id="detailContainer" class="opacity-40 pointer-events-none transition-all duration-300">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-green-700 flex items-center">
                            <span class="w-2 h-5 bg-green-700 inline-block mr-2 rounded"></span> 40人名單明細 (Detail)
                        </h2>
                        <button type="button" id="btnAddPlayer" onclick="addPlayerRow()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-sm font-medium transition">
                            ＋ 新增球員
                        </button>
                    </div>

                    <div class="overflow-x-auto border border-gray-200 rounded-lg shadow-sm mb-4">
                        <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                            <thead class="bg-gray-50 text-gray-700 font-medium">
                                <tr>
                                    <th class="p-3 w-20">背號</th>
                                    <th class="p-3 w-32">學號(PID)</th>
                                    <th class="p-3 w-32">姓名</th>
                                    <th class="p-3 w-20">性別</th>
                                    <th class="p-3 w-40">守備位置(LOV)</th>
                                    <th class="p-3 w-40">預設棒次(LOV)</th> <th class="p-3 w-36">加入日期</th>
                                    <th class="p-3 w-36">引退日期</th> <th class="p-3">備註</th>
                                    <th class="p-3 w-20 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="rosterTableBody" class="divide-y divide-gray-200 bg-white">
                                </tbody>
                        </table>
                    </div>

                    <div class="flex justify-end gap-4 border-t pt-4">
                        <button type="button" id="btnSaveDetail" onclick="saveDetailData()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded shadow text-sm font-medium transition">
                            📋 儲存球員名單
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://xteglzzciggiwblwzlvh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZWdsenpjaWdnaXdibHd6bHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODIwNzQsImV4cCI6MjA5NDc1ODA3NH0.5KM7d-OYmNK5RrFSL35WdYr2r_alYzWUXSbq0ZHfO6A';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTeamId = null;   
        let isLocked = 'N';
        let defOptionsCached = [];    // 快取守備常數清單
        let lineupOptionsCached = []; // ✨ 新增：快取棒次常數清單

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadDefConstants();    // 1-1. 載入守備位置字典
                await loadLineupConstants(); // 1-2. ✨ 新增：載入預設棒次字典
                await refreshQueryLov();     // 2. 載入頂部球隊選單
                toggleDetailSection(false);  // 3. 預設防呆鎖定明細
            } catch (err) {
                console.error("初始化失敗:", err.message);
            }
        });

        // 撈取守備位置常數 (DEF)
        async function loadDefConstants() {
            try {
                const { data, error } = await sbClient
                    .from('NMC_CONSTANTS')
                    .select('code, name_zh')
                    .eq('category', 'DEF')
                    .eq('is_active', 'Y')
                    .order('sort_order', { ascending: true });
                if (error) throw error;
                defOptionsCached = data || [];
            } catch (err) {
                console.error('載入守備常數失敗:', err.message);
            }
        }

        // ✨ 新增：撈取隊列棒次常數 (LINEUP)
        async function loadLineupConstants() {
            try {
                const { data, error } = await sbClient
                    .from('NMC_CONSTANTS')
                    .select('code, name_zh')
                    .eq('category', 'LINEUP')
                    .eq('is_active', 'Y')
                    .order('sort_order', { ascending: true });
                if (error) throw error;
                lineupOptionsCached = data || [];
            } catch (err) {
                console.error('載入棒次常數失敗:', err.message);
            }
        }

        // 載入頂部查詢選單
        async function refreshQueryLov() {
            try {
                const { data: teams, error } = await sbClient
                    .from('NMC_TEAMS')
                    .select('team_id, team_name')
                    .order('team_id', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('queryTeamSelect');
                if (!select) return;

                select.innerHTML = `<option value="NEW">➕ 建立全新球隊...</option>`;
                if (teams) {
                    teams.forEach(t => {
                        select.innerHTML += `<option value="${t.team_id}">[ID: ${t.team_id}] ${t.team_name}</option>`;
                    });
                }
                if (currentTeamId) {
                    select.value = currentTeamId;
                }
            } catch (err) {
                console.error('載入查詢選單失敗:', err.message);
            }
        }

        async function executeQuery() {
            const select = document.getElementById('queryTeamSelect');
            if (!select) return;
            const selectValue = select.value;
            
            if (selectValue === 'NEW') {
                currentTeamId = null;
                document.getElementById('teamForm').reset();
                document.getElementById('team_id').value = '';
                document.getElementById('team_name').value = '笨鳥慢飛';
                isLocked = 'N';
                handleLockStatus('N');
                toggleDetailSection(false); 
                document.getElementById('rosterTableBody').innerHTML = '';
            } else {
                currentTeamId = parseInt(selectValue);
                await loadTeamData();
            }
        }

        async function loadTeamData() {
            if (!currentTeamId) return;
            try {
                const { data: team, error: teamError } = await sbClient
                    .from('NMC_TEAMS')
                    .select('*')
                    .eq('team_id', currentTeamId)
                    .maybeSingle();

                if (teamError) throw teamError;

                if (team) {
                    document.getElementById('team_id').value = team.team_id;
                    document.getElementById('team_name').value = team.team_name || '';
                    document.getElementById('school').value = team.school || '';
                    document.getElementById('department').value = team.department || '';
                    document.getElementById('established_year').value = team.established_year || '';
                    document.getElementById('main_field').value = team.main_field || '';
                    document.getElementById('sub_field').value = team.sub_field || '';
                    document.getElementById('team_memo').value = team.memo || '';
                    isLocked = team.is_locked || 'N';
                }
                
                handleLockStatus(isLocked);
                toggleDetailSection(true); 

                const { data: rosters, error: rosterError } = await sbClient
                    .from('NMC_TEAM_ROSTERS')
                    .select('*')
                    .eq('team_id', currentTeamId)
                    .order('player_num', { ascending: true });

                if (rosterError) throw rosterError;

                const tbody = document.getElementById('rosterTableBody');
                tbody.innerHTML = ''; 
                
                if (rosters && rosters.length > 0) {
                    rosters.forEach(player => addPlayerRow(player));
                } else {
                    if (isLocked !== 'Y') addPlayerRow(); 
                }

                if (isLocked === 'Y') disableAllInputs();

            } catch (err) {
                console.error('讀取球隊資料失敗:', err.message);
            }
        }

        function toggleDetailSection(enable) {
            const container = document.getElementById('detailContainer');
            const alertBox = document.getElementById('detailWorkflowAlert');
            const btnAddPlayer = document.getElementById('btnAddPlayer');
            const btnSaveDetail = document.getElementById('btnSaveDetail');

            if (!container || !alertBox) return;

            if (enable) {
                container.classList.remove('opacity-40', 'pointer-events-none');
                alertBox.style.display = 'none';
                if(btnAddPlayer) btnAddPlayer.disabled = false;
                if(btnSaveDetail) btnSaveDetail.disabled = false;
            } else {
                container.classList.add('opacity-40', 'pointer-events-none');
                alertBox.style.display = 'block';
                if(btnAddPlayer) btnAddPlayer.disabled = true;
                if(btnSaveDetail) btnSaveDetail.disabled = true;
            }
        }

        // 7. 動態在 Table 中新增一筆球員輸入列 (擴充新欄位)
        function addPlayerRow(data = {}) {
            const tbody = document.getElementById('rosterTableBody');
            if (!tbody) return;
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.className = 'hover:bg-gray-50 transition';

            // 組裝守備下拉選單 (DEF)
            let defSelectOptions = `<option value="">-- 請選擇 --</option>`;
            defOptionsCached.forEach(opt => {
                const selected = (data.def_id === opt.code) ? 'selected' : '';
                defSelectOptions += `<option value="${opt.code}" ${selected}>${opt.code} - ${opt.name_zh}</option>`;
            });

            // ✨ 新增：組裝預設棒次下拉選單 (LINEUP)
            let lineupSelectOptions = `<option value="">-- 請選擇 --</option>`;
            lineupOptionsCached.forEach(opt => {
                const selected = (data.lineup_id === opt.code) ? 'selected' : '';
                lineupSelectOptions += `<option value="${opt.code}" ${selected}>${opt.code} - ${opt.name_zh}</option>`;
            });

            tr.innerHTML = `
                <td class="p-2">
                    <input type="hidden" class="player-id" value="${data.player_id || ''}">
                    <input type="text" class="player-num w-full border rounded p-1 text-center" value="${data.player_num || ''}" placeholder="018">
                </td>
                <td class="p-2"><input type="text" class="player-pid w-full border rounded p-1" value="${data.pid || ''}" placeholder="學號"></td>
                <td class="p-2"><input type="text" class="player-name w-full border rounded p-1" value="${data.player_name || ''}" placeholder="姓名"></td>
                <td class="p-2">
                    <select class="player-gender w-full border rounded p-1">
                        <option value="M" ${data.gender === 'M' ? 'selected' : ''}>男</option>
                        <option value="F" ${data.gender === 'F' ? 'selected' : ''}>女</option>
                    </select>
                </td>
                <td class="p-2">
                    <select class="player-def-id w-full border rounded p-1 font-semibold text-blue-800">
                        ${defSelectOptions}
                    </select>
                </td>
                <td class="p-2">
                    <select class="player-lineup-id w-full border rounded p-1 font-semibold text-purple-800">
                        ${lineupSelectOptions}
                    </select>
                </td>
                <td class="p-2"><input type="date" class="player-join-date w-full border rounded p-1" value="${data.join_date || ''}"></td>
                <td class="p-2"><input type="date" class="player-retire-date w-full border rounded p-1 text-red-600" value="${data.retire_date || ''}"></td>
                <td class="p-2"><input type="text" class="player-memo w-full border rounded p-1" value="${data.memo || ''}"></td>
                <td class="p-2 text-center">
                    <button type="button" onclick="deleteRow('${rowId}')" class="btn-delete text-red-600 hover:text-red-900 font-medium">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function deleteRow(rowId) {
            if (isLocked === 'Y') return;
            const row = document.getElementById(rowId);
            if (row) row.remove();
        }

        // 💾 階段一儲存：主檔 (Master)
        async function saveMasterData() {
            const teamNameEl = document.getElementById('team_name');
            if (!teamNameEl) return;
            const teamName = teamNameEl.value.trim();
            if (!teamName) {
                alert('請先輸入「隊名」！');
                return;
            }

            try {
                const teamData = {
                    team_name: teamName,
                    school: document.getElementById('school').value,
                    department: document.getElementById('department').value,
                    established_year: document.getElementById('established_year').value ? parseInt(document.getElementById('established_year').value) : null,
                    main_field: document.getElementById('main_field').value,
                    sub_field: document.getElementById('sub_field').value,
                    memo: document.getElementById('team_memo').value,
                    is_locked: 'N'
                };

                if (currentTeamId) {
                    teamData.team_id = currentTeamId;
                }

                const { data, error } = await sbClient
                    .from('NMC_TEAMS')
                    .upsert(teamData)
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    currentTeamId = data[0].team_id;
                    document.getElementById('team_id').value = currentTeamId;
                    alert(`球隊 [${teamName}] 主檔儲存成功！已生成球隊編號，下方名單開放登錄。`);
                    
                    await refreshQueryLov();   
                    toggleDetailSection(true); 
                    if (document.querySelectorAll('#rosterTableBody tr').length === 0) {
                        addPlayerRow();        
                    }
                }
            } catch (err) {
                alert('主檔儲存失敗: ' + err.message);
            }
        }

        // 📋 階段二儲存：明細檔 (Detail - 包含收集新欄位)
        async function saveDetailData() {
            if (!currentTeamId) {
                alert('錯誤：缺乏球隊編號，請先執行第一階段「儲存球隊主檔」！');
                return;
            }

            try {
                const rows = document.querySelectorAll('#rosterTableBody tr');
                const rosterDataArray = [];

                rows.forEach(row => {
                    const name = row.querySelector('.player-name').value.trim();
                    if (name) { 
                        rosterDataArray.push({
                            team_id: currentTeamId,
                            player_num: row.querySelector('.player-num').value.trim(),
                            pid: row.querySelector('.player-pid').value.trim(),
                            player_name: name,
                            gender: row.querySelector('.player-gender').value,
                            def_id: row.querySelector('.player-def-id').value || null, 
                            lineup_id: row.querySelector('.player-lineup-id').value || null, // ✨ 新增寫入
                            join_date: row.querySelector('.player-join-date').value || null,
                            retire_date: row.querySelector('.player-retire-date').value || null, // ✨ 新增寫入
                            memo: row.querySelector('.player-memo').value.trim()
                        });
                    }
                });

                const { error: deleteError } = await sbClient
                    .from('NMC_TEAM_ROSTERS')
                    .delete()
                    .eq('team_id', currentTeamId);

                if (deleteError) throw deleteError;

                if (rosterDataArray.length > 0) {
                    const { error: insertError } = await sbClient
                        .from('NMC_TEAM_ROSTERS')
                        .insert(rosterDataArray);
                    
                    if (insertError) throw insertError;
                }

                alert('40人球員名單明細儲存成功！');
                await loadTeamData();

            } catch (err) {
                alert('明細儲存失敗: ' + err.message);
            }
        }

        function handleLockStatus(status) {
            const badge = document.getElementById('lockStatusBadge');
            const btnSaveMaster = document.getElementById('btnSaveMaster');
            const btnSaveDetail = document.getElementById('btnSaveDetail');
            const btnAddPlayer = document.getElementById('btnAddPlayer');

            if (!badge) return;

            if (status === 'Y') {
                badge.innerText = '🔒 已鎖定 (唯讀)';
                badge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-red-100 text-red-700';
                if(btnSaveMaster) btnSaveMaster.style.display = 'none';
                if(btnSaveDetail) btnSaveDetail.style.display = 'none';
                if(btnAddPlayer) btnAddPlayer.style.display = 'none';
                disableAllInputs();
            } else {
                badge.innerText = '🔓 開放編輯中';
                badge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-green-100 text-green-700';
                if(btnSaveMaster) btnSaveMaster.style.display = 'block';
                if(btnSaveDetail) btnSaveDetail.style.display = 'block';
                if(btnAddPlayer) btnAddPlayer.style.display = 'block';
            }
        }

        function disableAllInputs() {
            const form = document.getElementById('teamForm');
            if (!form) return;
            const inputs = form.querySelectorAll('input, select, button');
            inputs.forEach(input => {
                if(input.id !== 'queryTeamSelect' && input.getAttribute('onclick') !== 'executeQuery()') {
                    input.disabled = true;
                    input.classList.add('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
                }
            });
            document.querySelectorAll('.btn-delete').forEach(btn => btn.style.display = 'none');
        }
    </script>
</body>
</html>
